context:
  version: "1.13.0"

package:
  name: jq.py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/j/jq/jq-${{ version }}.tar.gz
  sha256: e62bdddeab3b8a0a404581a7bb6f1e8c4cc6082280870031f746074f4cac52c0

build:
  number: 0
  skip:
    - win
  script:
    env:
      JQPY_USE_SYSTEM_LIBS: "1"
    content:
      # make sure we're not using the vendored library
      - rm -r deps
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython ==3.2.3
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - cython ==3.2.3
    - setuptools >=43
    - pip
    - jq
  run:
    - python
    - jq

tests:
  - python:
      imports:
        - jq
      pip_check: true
  - requirements:
      run:
        - pytest
    files:
      source:
        - tests/
        - tox.ini
    script:
      - pytest

about:
  homepage: https://github.com/mwilliamson/jq.py
  summary: Python bindings for jq
  description: |
    This project contains python bindings for jq, a lightweight and flexible
    JSON processor
  license: BSD-2-Clause
  license_file: LICENSE
  repository: https://github.com/mwilliamson/jq.py

extra:
  recipe-maintainers:
    - I-Al-Istannen
    - mgorny
