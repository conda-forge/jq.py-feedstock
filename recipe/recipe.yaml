context:
  name: jq.py
  pypi_name: jq
  version: "1.11.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ pypi_name[0] }}/${{ pypi_name }}/${{ pypi_name }}-${{ version }}.tar.gz
  sha256: 67f1032e3a61b4e5dcdd4e390527b0000db521ac9872b64517c83c5f71ef8450

build:
  script: env JQPY_USE_SYSTEM_LIBS=1 python -m pip install . -vv
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - cython ==3.2.1
    - jq
  run:
    - python
    - jq

tests:
  - python:
      imports:
        - jq
      pip_check: true

about:
  homepage: https://github.com/mwilliamson/jq.py
  summary: Python bindings for jq
  description: |
    This project contains python bindings for jq, a lightweight and flexible
    JSON processor
  license: BSD-2-Clause
  license_file: LICENSE
  repository: https://github.com/mwilliamson/jq.py

extra:
  recipe-maintainers:
    - I-Al-Istannen
